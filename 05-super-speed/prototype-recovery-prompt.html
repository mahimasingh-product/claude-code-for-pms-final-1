<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Responder Prompt</title>
    <style>
      :root {
        --bg: #f3f7ff;
        --surface: #ffffff;
        --ink: #182636;
        --muted: #61718a;
        --primary: #1f5ef3;
        --primary-soft: #eaf1ff;
        --accent: #f4b43c;
        --accent-soft: #fff1d2;
        --good: #1c8c61;
        --good-soft: #e8faf2;
        --line: #dde7f8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #edf3ff 0%, #f7f9fc 180px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      .app {
        width: min(100%, 420px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 30px;
        box-shadow: 0 16px 40px rgba(19, 32, 58, 0.12);
        overflow: hidden;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .hero {
        padding: 0 18px 18px;
      }
      .avatar-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1f5ef3, #6d8fff);
        display: grid;
        place-items: center;
        color: white;
        font-weight: 800;
      }
      .meta strong { display: block; }
      .meta small { color: var(--muted); }
      .notice {
        background: linear-gradient(180deg, #fffaf0 0%, #fff5db 100%);
        border: 1px solid #efcf7c;
        border-radius: 22px;
        padding: 18px 16px 14px;
      }
      .notice h2 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.2;
      }
      .notice p {
        margin: 0 0 14px;
        font-size: 13px;
        line-height: 1.5;
        color: #6a4d12;
      }
      .actions {
        display: grid;
        gap: 10px;
      }
      button {
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .primary { background: var(--primary); color: white; }
      .secondary { background: var(--primary-soft); color: var(--primary); }
      .neutral { background: #fff0d2; color: #8a5d00; }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        padding: 12px 18px 18px;
      }
      .pill {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
      }
      .pill.warn { background: var(--accent-soft); color: #8b5e00; }
      .pill.good { background: var(--good-soft); color: var(--good); }
      .answer {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span>9:41</span>
        <span>Rook</span>
      </div>

      <div class="hero">
        <div class="avatar-row">
          <div class="avatar">K</div>
          <div class="meta">
            <strong>Kip</strong>
            <small>Responder</small>
          </div>
        </div>

        <div class="notice" id="notice">
          <h2>We noticed a quieter pattern.</h2>
          <p>We’re reducing the number of pings until you confirm you’re available.</p>
          <div class="actions">
            <button class="primary" data-choice="available">I’m available now</button>
            <button class="secondary" data-choice="later">I’m taking a break</button>
            <button class="neutral" data-choice="fewer">Fewer pings</button>
          </div>
        </div>
      </div>

      <div class="footer">
        <span class="pill warn" id="statePill">Recovery</span>
        <span class="answer" id="statusText">Waiting for your answer</span>
      </div>
    </div>

    <script>
      const notice = document.getElementById('notice');
      const statePill = document.getElementById('statePill');
      const statusText = document.getElementById('statusText');

      function setChoice(choice) {
        const states = {
          available: {
            title: 'Available again',
            body: 'Thanks — we’ve restored normal routing for your available window.',
            state: 'Active',
            stateClass: 'good',
            text: 'Confirmed and back in the queue'
          },
          later: {
            title: 'We’ll pause new work',
            body: 'No problem. We’ll hold off on new callouts until you’re ready again.',
            state: 'Paused',
            stateClass: 'warn',
            text: 'Temporary pause saved'
          },
          fewer: {
            title: 'We’ll lower the noise',
            body: 'You’ll get fewer pings while we keep your availability settings light.',
            state: 'Lower volume',
            stateClass: 'warn',
            text: 'Fewer pings enabled'
          }
        };

        const state = states[choice];
        notice.innerHTML = `
          <h2>${state.title}</h2>
          <p>${state.body}</p>
          <div class="actions">
            <button class="primary" data-choice="available">I’m available now</button>
            <button class="secondary" data-choice="later">I’m taking a break</button>
            <button class="neutral" data-choice="fewer">Fewer pings</button>
          </div>
        `;
        statePill.textContent = state.state;
        statePill.className = 'pill ' + state.stateClass;
        statusText.textContent = state.text;

        notice.querySelectorAll('button').forEach(button => {
          button.addEventListener('click', () => setChoice(button.dataset.choice));
        });
      }

      document.querySelectorAll('[data-choice]').forEach(button => {
        button.addEventListener('click', () => setChoice(button.dataset.choice));
      });
    </script>
  </body>
</html>
